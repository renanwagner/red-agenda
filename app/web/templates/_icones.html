{# Ícones SVG decorativos: o texto ao lado sempre carrega o significado #}
{% macro icone(nome) -%}
<svg class="icone" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
  {%- if nome == 'check' %}
  <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  {%- elif nome == 'triangulo' %}
  <path d="M12 3L2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <path d="M12 10v4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="12" cy="17.3" r="1.3" fill="currentColor"/>
  {%- elif nome == 'info' %}
  <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M12 11v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="12" cy="7.5" r="1.3" fill="currentColor"/>
  {%- elif nome == 'erro' %}
  <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M12 7v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="12" cy="16.8" r="1.3" fill="currentColor"/>
  {%- endif %}
</svg>
{%- endmacro %}
