{% extends "base.html" %}
{% block titulo %}Painel – RED Barbearia{% endblock %}
{% block conteudo %}
<h1>Painel – {{ current_user.nome }}</h1>

<ul class="lista-limpa acoes">
  <li><a class="botao botao--principal" href="{{ url_for('painel.agenda') }}">Agenda</a></li>
  <li><a class="botao botao--principal" href="{{ url_for('painel.janelas_lista') }}">Janelas de atendimento</a></li>
</ul>

<form class="acoes" method="post" action="{{ url_for('painel.sair') }}">
  <input name="csrf_token" type="hidden" value="{{ csrf_token() }}">
  <button type="submit" class="botao botao--secundario">Sair</button>
</form>
{% endblock %}
