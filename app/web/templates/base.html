<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}RED Barbearia{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="cabecalho">
    <a class="marca" href="{{ url_for('web.escolha') }}">
      <img src="{{ url_for('static', filename='img/logo-red.png') }}" alt="Logo RED Barbearia" width="40" height="40">
    </a>
  </header>
  <main id="conteudo" class="principal" tabindex="-1">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
